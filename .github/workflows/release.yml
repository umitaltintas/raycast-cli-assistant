# On a v* tag, builds the extension and creates a GitHub Release with the
# cli-assistant.tar.gz package that install.sh downloads.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - name: Test and lint
        run: npm run check

      - name: Build
        run: |
          npx ray build -e dist -o dist -I
          rm -f dist/*.map
          cp -R spotlight dist/spotlight
          echo "${GITHUB_REF_NAME}" > dist/VERSION
          tar -czf cli-assistant.tar.gz -C dist .

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" cli-assistant.tar.gz \
            --title "$GITHUB_REF_NAME" --generate-notes
